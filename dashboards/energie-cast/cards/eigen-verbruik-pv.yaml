type: custom:button-card
entity: sensor.sigen_plant_daily_third_party_inverter_energy
name: Eigen verbruik PV · vandaag
show_icon: false
show_state: false
variables:
  pv: sensor.sigen_plant_daily_third_party_inverter_energy
  imp: sensor.sigen_plant_daily_grid_import_energy
  exp: sensor.sigen_plant_daily_grid_export_energy
  imp_eur: sensor.zonneplan_afname_vandaag
  exp_eur: sensor.zonneplan_teruglevering_vandaag
triggers_update:
  - sensor.sigen_plant_daily_third_party_inverter_energy
  - sensor.sigen_plant_daily_grid_import_energy
  - sensor.sigen_plant_daily_grid_export_energy
  - sensor.zonneplan_afname_vandaag
  - sensor.zonneplan_teruglevering_vandaag
custom_fields:
  pct: >
    [[[ const n = id => { const s = states[id]; return s ?
    parseFloat(s.state) || 0 : 0; };
        const pv = n(variables.pv), ex = n(variables.exp);
        if (pv <= 0) return '–';
        const p = Math.max(0, Math.min(100, (pv - ex) / pv * 100));
        return p.toFixed(0) + '<span style="font-size:14px;opacity:.75"> % zelf gebruikt</span>'; ]]]
  bar: >
    [[[ const n = id => { const s = states[id]; return s ?
    parseFloat(s.state) || 0 : 0; };
        const pv = n(variables.pv), ex = n(variables.exp);
        const p = pv > 0 ? Math.max(0, Math.min(100, (pv - ex) / pv * 100)) : 0;
        return '<div style="width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden">'
             + '<div style="width:' + p + '%;height:100%;border-radius:3px;background:rgba(255,255,255,.9)"></div></div>'; ]]]
  list: >
    [[[ const n = id => { const s = states[id]; return s ?
    parseFloat(s.state) || 0 : 0; };
        const kwh = v => v.toLocaleString('nl-NL', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' kWh';
        const eur = v => '€ ' + v.toLocaleString('nl-NL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const row = (label, arrow, col, e, m) =>
          '<div style="display:flex;justify-content:space-between;align-items:baseline;width:100%;'
          + 'padding:5px 0;border-top:1px solid rgba(255,255,255,.1)">'
          + '<span style="font-size:13px;opacity:.85"><span style="color:' + col + '">' + arrow + '</span> ' + label + '</span>'
          + '<span style="font-size:14px;font-weight:500">' + kwh(e)
          + '<span style="opacity:.7;font-weight:400"> · ' + eur(m) + '</span></span></div>';
        return row('Ingekocht', '▼', 'rgb(255,138,115)', n(variables.imp), n(variables.imp_eur))
             + row('Verkocht', '▲', 'rgb(111,220,154)', n(variables.exp), n(variables.exp_eur)); ]]]
styles:
  card:
    - height: 100%
    - box-sizing: border-box
    - padding: 12px 14px
    - border-radius: 12px
    - border: none
    - color: white
    - background: >
        [[[ const n = id => { const s = states[id]; return s ?
        parseFloat(s.state) || 0 : 0; };
            const pv = n(variables.pv), ex = n(variables.exp);
            const p = pv > 0 ? (pv - ex) / pv * 100 : 0;
            if (pv <= 0) return 'linear-gradient(135deg, rgb(35,43,54), rgb(58,70,86))';
            if (p >= 70) return 'linear-gradient(135deg, rgb(23,86,58), rgb(46,157,98))';
            if (p >= 40) return 'linear-gradient(135deg, rgb(138,75,15), rgb(217,150,43))';
            return 'linear-gradient(135deg, rgb(35,43,54), rgb(58,70,86))'; ]]]
  grid:
    - grid-template-areas: '"n" "pct" "bar" "list"'
    - grid-template-columns: 1fr
    - align-content: center
  name:
    - font-size: 14px
    - font-weight: 500
    - color: rgba(255,255,255,.9)
    - justify-self: start
  custom_fields:
    pct:
      - font-size: 28px
      - font-weight: 500
      - justify-self: start
    bar:
      - width: 100%
      - padding: 4px 0 8px
    list:
      - width: 100%
      - justify-self: stretch
grid_options:
  columns: 8
  rows: 2.5
