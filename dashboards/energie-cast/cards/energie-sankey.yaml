  - source: huis
    target: athom_smart_plug_v2_a787c0_total_energy
  - source: huis
    target: athom_sp_v2_a7d1e6_buro_total_energy
  - source: huis
    target: athom_smart_plug_v2_d78248_total_energy
  - source: huis
    target: lampen_energy
  - source: huis
    target: audio_tv_energy
  - source: huis
    target: network_energy
  - source: huis
    target: airco_kantoor_energy_usage_cycle_2
  - source: huis
    target: aircowoonkamer_energy_usage_cycle
  - source: huis
    target: airco_kantoor_energy_usage_cycle
  - source: huis
    target: overig
