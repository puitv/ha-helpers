type: vertical-stack
grid_options:
  columns: 8
  rows: 2.5
cards:
  - type: conditional
    conditions:
      - condition: numeric_state
        entity: sensor.sigen_plant_pv_power
        above: 0.05
    card:
      type: custom:apexcharts-card
      graph_span: 24h
      span:
        start: day
      header:
        show: true
        title: PV · Opwek
        show_states: true
        colorize_states: false
      now:
        show: true
        color: rgb(255,255,255)
        label: Nu
      yaxis:
        - min: 0
          decimals: 1
          apex_config:
            tickAmount: 4
      series:
        - entity: sensor.sigen_plant_pv_power
          name: PV
          type: area
          stroke_width: 2
          color: rgb(255,255,255)
          opacity: 0.25
          extend_to: now
          show:
            name_in_header: false
          group_by:
            func: avg
            duration: 15min
        - entity: sensor.evcc_forecast_solar
          name: Verwachting
          type: line
          stroke_width: 2
          color: rgb(255,243,196)
          extend_to: false
          show:
            in_header: false
          data_generator: >
            const ts = entity.attributes.timeseries || {};

            const values = ts.values || [];

            const deltas = ts.deltas_in_minutes || [];

            let t = new Date(ts.start_utc).getTime();

            const pts = values.map((v, i) => {
              const p = [t, v / 1000];
              t += (deltas[i] || 15) * 60 * 1000;
              return p;
            });

            return pts.filter(p => p[0] >= Date.now() - 30 * 60 *
            1000);
        - entity: sensor.power_production_now
          name: Verwachting
          type: line
          unit: kW
          stroke_width: 2
          color: rgb(255,243,196)
          extend_to: false
          show:
            in_header: false
          data_generator: |
            // Forecast.Solar (Huis + Garage) history, up to where the evcc forecast starts
            const ids = ['sensor.power_production_now', 'sensor.power_production_now_2'];
            const step = 15 * 60 * 1000;
            const until = Math.ceil((Date.now() - 30 * 60 * 1000) / step) * step;
            const hist = await hass.callWS({
              type: 'history/history_during_period',
              start_time: start.toISOString(),
              end_time: new Date().toISOString(),
              entity_ids: ids,
              minimal_response: true,
              no_attributes: true,
              significant_changes_only: false,
            });
            const series = ids.map(id => (hist[id] || [])
              .map(s => [s.lu * 1000, parseFloat(s.s)])
              .filter(p => !isNaN(p[1])));
            const at = (pts, t) => {
              let v = 0;
              for (const p of pts) { if (p[0] > t) break; v = p[1]; }
              return v;
            };
            const out = [];
            for (let t = start.getTime(); t <= until; t += step) {
              out.push([t, series.reduce((sum, pts) => sum + at(pts, t), 0) / 1000]);
            }
            return out;
        - entity: sensor.sigen_plant_daily_third_party_inverter_energy
          name: vandaag
          unit: kWh
          float_precision: 1
          show:
            in_chart: false
            in_header: true
            name_in_header: true
        - entity: sensor.energy_production_today
          name: prognose
          unit: kWh
          float_precision: 1
          show:
            in_chart: false
            in_header: true
            name_in_header: true
          data_generator: |
            // Forecast.Solar day total, Huis + Garage
            const ids = ['sensor.energy_production_today', 'sensor.energy_production_today_2'];
            return [[Date.now(), ids.reduce((sum, id) => sum + (parseFloat(hass.states[id]?.state) || 0), 0)]];
        - entity: sensor.evcc_forecast_solar
          name: nog te gaan
          unit: kWh
          float_precision: 1
          extend_to: false
          show:
            in_chart: false
            in_header: after_now
            name_in_header: true
          data_generator: >
            const ts = entity.attributes.timeseries || {};

            const values = ts.values || [];

            const deltas = ts.deltas_in_minutes || [];

            const now = Date.now();

            const endOfDay = new Date(); endOfDay.setHours(24, 0, 0,
            0);

            let t = new Date(ts.start_utc).getTime();

            let sum = 0;

            values.forEach((v, i) => {
              const next = t + (deltas[i] || 15) * 60 * 1000;
              const start = Math.max(t, now);
              const end = Math.min(next, endOfDay.getTime());
              if (end > start) sum += (v / 1000) * (end - start) / 3600000;
              t = next;
            });

            return [[now + 60000, sum]];
      apex_config:
        chart:
          height: 95
          foreColor: rgba(255,255,255,.8)
          toolbar:
            show: false
          zoom:
            enabled: false
        stroke:
          dashArray:
            - 0
            - 5
            - 5
        grid:
          borderColor: rgba(255,255,255,.15)
          padding:
            top: -20
            left: 4
            right: 10
            bottom: 0
          xaxis:
            lines:
              show: true
        xaxis:
          tickAmount: 6
          labels:
            format: HH:mm
            style:
              fontSize: 11px
        legend:
          show: false
        tooltip:
          theme: dark
      card_mod:
        style: |
          ha-card {
            height: 150px; box-sizing: border-box;
            position: relative; overflow: hidden; border: none;
            --primary-text-color: #fff;
            --secondary-text-color: rgba(255,255,255,.85);
            background: linear-gradient(135deg, #8a4b0f, #d9962b);
          }
          #header {
            padding: 8px 14px 0 !important;
            margin: 0 0 0px 0 !important;
          }
          #header__title {
            font-size: 14px !important;
            line-height: 1.2 !important;
            margin: 0 !important;
          }
          #header__states {
            margin: -2px 0 0 0 !important;
            padding: 0 !important;
          }
          #header__states {
            align-items: baseline !important;
            justify-content: flex-start !important;
          }
          #header__states > div:first-child {
            zoom: 1;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1 !important;
          }
          #header__states > div:nth-child(n+2) {
            display: flex !important;
            align-items: baseline;
            gap: 4px;
            margin: 0 0 0 14px !important;
            padding: 0 !important;
            line-height: 1 !important;
            opacity: .9;
          }
          #header__states > div:nth-child(n+3) {
            position: absolute !important;
            right: 14px;
            margin: 0 !important;
          }
          #header__states > div:nth-child(3) { top: 8px; }
          #header__states > div:nth-child(4) { top: 32px; }
          #header__states > div:nth-child(n+2) #state { font-size: 20px !important; }
          #header__states > div:nth-child(n+2) #uom { font-size: 13px !important; }
          #header__states > div:nth-child(n+2) #state__name { font-size: 12px !important; }
