path: energie-cast
max_columns: 2
title: Energie Cast
sections:
  - type: grid
    column_span: 2
    cards:
      - !include cards/thuisaccu.yaml
      - !include cards/id4.yaml
      - !include cards/net.yaml
  - type: grid
    column_span: 2
    cards:
      - !include cards/pv-opwek.yaml
      - !include cards/eigen-verbruik-pv.yaml
      - !include cards/energie-netto.yaml
      - !include cards/evcc-laadmodus.yaml
      - !include cards/energiestatus.yaml
      - !include cards/prijs-nu.yaml
      - !include cards/prijs-volgend-uur.yaml
      - !include cards/prijs-laagste-vandaag.yaml
      - !include cards/prijs-hoogste-vandaag.yaml
      - !include cards/prijs-laagste-morgen.yaml
      - !include cards/prijs-hoogste-morgen.yaml
  - type: grid
    cards:
      - type: energy-sankey
        layout: auto
        group_by_floor: true
        group_by_area: true
  - type: grid
    cards:
      - type: energy-devices-graph
  - type: grid
    cards:
      - !include cards/stroomprijs-grafiek.yaml
  - type: grid
    cards:
      - type: heading
        heading_style: title
      - type: energy-usage-graph
    column_span: 1
    background:
      opacity: 50
    visibility:
      - condition: numeric_state
        above: -0.5
        below: 0.5
        entity: sensor.huidige_verbruik
  - type: grid
    cards:
      - type: power-sources-graph
        grid_options:
          rows: auto
          columns: 24
        expand_legend: true
        show_legend: true
    column_span: 2
footer: {}
cards: []
dense_section_placement: true
